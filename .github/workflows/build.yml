name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  core:
    name: Core tests (real yt-dlp + ffmpeg)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install ffmpeg and the newest yt-dlp
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q "yt-dlp[default]"
          /tmp/venv/bin/yt-dlp --version
      - name: Test
        run: ./gradlew -p core test -Ddalma.engineTests=true -Ddalma.ytdlp=/tmp/venv/bin/yt-dlp --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: core-test-reports
          path: core/build/reports/tests

  app:
    name: App (tests, lint, screenshots, APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
            IFS=. read -r major minor patch <<< "${name%%-*}"
            code=$(( major * 10000 + minor * 100 + ${patch:-0} ))
          else
            name="0.0.0-preview+${GITHUB_SHA::7}"
            code="$GITHUB_RUN_NUMBER"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Dalma $name ($code)"

      - name: Bundle the newest yt-dlp (verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/fetch-ytdlp.sh app/src/main/res/raw/ytdlp

      - name: Signing key (when the secrets exist)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.DALMA_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dalma.jks"
            echo "DALMA_KEYSTORE_FILE=$RUNNER_TEMP/dalma.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No DALMA_KEYSTORE_BASE64 secret: the APK will be signed with a debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests, lint, screenshots
        run: >
          ./gradlew --console=plain
          -PdalmaVersionName=${{ steps.version.outputs.name }}
          -PdalmaVersionCode=${{ steps.version.outputs.code }}
          :app:testDebugUnitTest :app:recordRoborazziDebug :app:lintDebug

      - name: Release APK (arm64)
        env:
          DALMA_KEYSTORE_PASSWORD: ${{ secrets.DALMA_KEYSTORE_PASSWORD }}
          DALMA_KEY_ALIAS: ${{ secrets.DALMA_KEY_ALIAS }}
          DALMA_KEY_PASSWORD: ${{ secrets.DALMA_KEY_PASSWORD }}
          DALMA_UPDATE_READ_TOKEN: ${{ secrets.DALMA_UPDATE_READ_TOKEN }}
        run: >
          ./gradlew --console=plain
          -PdalmaVersionName=${{ steps.version.outputs.name }}
          -PdalmaVersionCode=${{ steps.version.outputs.code }}
          :app:assembleRelease

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Dalma-${{ steps.version.outputs.name }}.apk"
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dalma-apk
          path: out/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots
          path: app/build/outputs/roborazzi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: app-reports
          path: |
            app/build/reports
            app/build/test-results

      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name == 'push'
        run: |
          set -e
          dir=$(mktemp -d)
          cp -r app/build/outputs/roborazzi/. "$dir/" 2>/dev/null || true
          cd "$dir"
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "# Screenshots from ${GITHUB_SHA::7} (${GITHUB_REF_NAME})" > README.md
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA::7} [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Preview pre-release (every push to the main branches)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --yes --cleanup-tag 2>/dev/null || true
          gh release create preview out/*.apk --prerelease --title "Dalma előnézet (${GITHUB_SHA::7})" \
            --notes "Automatikus előnézet a(z) ${GITHUB_REF_NAME} ágról. Aláírás: ${{ steps.signing.outputs.signed == 'true' && 'saját kulcs' || 'debug kulcs (telepítés előtt töröld a korábbi, másképp aláírt Dalmát)' }}."

      - name: Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/*.apk --title "Dalma ${{ steps.version.outputs.name }}" --generate-notes

  emulator:
    name: On a phone (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: app
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Bundle the newest yt-dlp (verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/fetch-ytdlp.sh app/src/main/res/raw/ytdlp
      - name: Offline engine, tags and Music folder
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --console=plain -PdalmaAbis=x86_64 :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=io.github.itemujinwork.dalma.OnlineSmokeTest
      - name: A real YouTube link (best effort, YouTube may block the runner)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --console=plain -PdalmaAbis=x86_64 :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.itemujinwork.dalma.OnlineSmokeTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: emulator-reports
          path: app/build/reports/androidTests
