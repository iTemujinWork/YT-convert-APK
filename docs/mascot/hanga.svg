    <path fill="none" stroke="#2E1A2E" stroke-width="3.4" stroke-linecap="round" d="M132.5 112 C136.5 119 149.5 119 153.5 112"/>
    <path fill="none" stroke="#2E1A2E" stroke-width="2.2" stroke-linecap="round" d="M86.8 112.2 L83.6 110.4"/>
    <path fill="none" stroke="#2E1A2E" stroke-width="2.2" stroke-linecap="round" d="M153.2 112.2 L156.4 110.4"/>
  </g>

  <g id="brows_soft">
    <path fill="none" stroke="#5A3150" stroke-width="2.8" stroke-linecap="round" d="M88 94.5 C93 91.5 100 91 106 92.5"/>
    <path fill="none" stroke="#5A3150" stroke-width="2.8" stroke-linecap="round" d="M134 92.5 C140 91 147 91.5 152 94.5"/>
  </g>

  <g id="brows_worried">
    <path fill="none" stroke="#5A3150" stroke-width="2.8" stroke-linecap="round" d="M88 96 C94 95.5 101 93 106 89"/>
    <path fill="none" stroke="#5A3150" stroke-width="2.8" stroke-linecap="round" d="M134 89 C139 93 146 95.5 152 96"/>
  </g>

  <g id="mouth_smile">
    <path fill="none" stroke="#B24A67" stroke-width="2.6" stroke-linecap="round" d="M112 140 C115.5 145 124.5 145 128 140"/>
  </g>

  <g id="mouth_open">
    <path fill="#A93E5B" d="M110.5 138.5 C113 151.5 127 151.5 129.5 138.5 C123.5 140.5 116.5 140.5 110.5 138.5 Z"/>
    <path fill="#F28CA3" d="M114.6 145.6 C117.4 149.4 122.6 149.4 125.4 145.6 C122 143.8 118 143.8 114.6 145.6 Z"/>
  </g>

  <g id="mouth_o">
    <ellipse fill="#A93E5B" cx="120" cy="143" rx="4.2" ry="5"/>
    <ellipse fill="#F28CA3" cx="120" cy="145.2" rx="2.4" ry="1.8"/>
  </g>

  <g id="mouth_hum">
    <path fill="none" stroke="#B24A67" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" d="M114 140.5 C115.8 143.6 118.6 143.6 120 141 C121.4 143.6 124.2 143.6 126 140.5"/>
  </g>

