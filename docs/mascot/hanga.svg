    <ellipse fill="url(#irisR)" cx="143" cy="114" rx="10.5" ry="12.8"/>
    <ellipse fill="#2A132B" cx="97" cy="113" rx="5" ry="6.4"/>
    <ellipse fill="#2A132B" cx="143" cy="113" rx="5" ry="6.4"/>
    <circle fill="#FFFFFF" cx="93.2" cy="108.2" r="3.8"/>
    <circle fill="#FFFFFF" cx="139.2" cy="108.2" r="3.8"/>
    <circle fill="#FFFFFF" fill-opacity="0.85" cx="101" cy="119.5" r="1.7"/>
    <circle fill="#FFFFFF" fill-opacity="0.85" cx="147" cy="119.5" r="1.7"/>
    <path fill="none" stroke="#2E1A2E" stroke-width="3.4" stroke-linecap="round" d="M85.4 108 C88.8 101 105 100.2 109.6 106.6"/>
    <path fill="none" stroke="#2E1A2E" stroke-width="2.6" stroke-linecap="round" d="M85.4 108 L81.4 104.2"/>
    <path fill="none" stroke="#2E1A2E" stroke-width="3.4" stroke-linecap="round" d="M130.4 106.6 C135 100.2 151.2 101 154.6 108"/>
    <path fill="none" stroke="#2E1A2E" stroke-width="2.6" stroke-linecap="round" d="M154.6 108 L158.6 104.2"/>
  </g>

  <g id="eyes_happy">
