<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    Hanga, the mascot. Layers are <g> elements with an id; tools/svg2compose.py turns each
    layer into a Compose ImageVector so the app can blink, change mood and sway.
    Rules for this file: absolute coordinates, gradients in userSpaceOnUse, no filters.
  -->
  <defs>
    <linearGradient id="hair" gradientUnits="userSpaceOnUse" x1="120" y1="30" x2="120" y2="196">
      <stop offset="0" stop-color="#6A3D5F"/>
      <stop offset="1" stop-color="#4A2742"/>
    </linearGradient>
    <linearGradient id="hairFront" gradientUnits="userSpaceOnUse" x1="120" y1="34" x2="120" y2="176">
      <stop offset="0" stop-color="#7B4A6F"/>
      <stop offset="0.55" stop-color="#5E3455"/>
      <stop offset="1" stop-color="#4E2A47"/>
    </linearGradient>
    <linearGradient id="hoodie" gradientUnits="userSpaceOnUse" x1="120" y1="176" x2="120" y2="240">
      <stop offset="0" stop-color="#D7B3E8"/>
      <stop offset="1" stop-color="#B98ED3"/>
    </linearGradient>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="120" y1="48" x2="120" y2="168">
      <stop offset="0" stop-color="#FFE7DA"/>
      <stop offset="1" stop-color="#FFD9C8"/>
    </linearGradient>
    <linearGradient id="irisL" gradientUnits="userSpaceOnUse" x1="97" y1="102" x2="97" y2="127">
      <stop offset="0" stop-color="#3A1E3B"/>
      <stop offset="1" stop-color="#8A4F82"/>
    </linearGradient>
    <linearGradient id="irisR" gradientUnits="userSpaceOnUse" x1="143" y1="102" x2="143" y2="127">
      <stop offset="0" stop-color="#3A1E3B"/>
      <stop offset="1" stop-color="#8A4F82"/>
    </linearGradient>
    <radialGradient id="blushL" gradientUnits="userSpaceOnUse" cx="85" cy="132" r="13">
      <stop offset="0" stop-color="#FF8FAB" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FF8FAB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blushR" gradientUnits="userSpaceOnUse" cx="155" cy="132" r="13">
      <stop offset="0" stop-color="#FF8FAB" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FF8FAB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cup" gradientUnits="userSpaceOnUse" x1="0" y1="92" x2="0" y2="138">
      <stop offset="0" stop-color="#E08CC7"/>
      <stop offset="1" stop-color="#B9609F"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- hair behind the head -->
    <path fill="url(#hair)" d="M122 30 C80 30 50 58 48 100 C46 128 50 150 44 172 C42 182 48 192 58 192 C64 196 72 196 78 190 C84 194 92 192 96 186 L144 186 C148 192 156 194 162 190 C168 196 176 196 182 192 C192 192 198 182 196 172 C190 150 194 128 192 100 C190 58 164 30 122 30 Z"/>
    <path fill="#3D1F37" d="M82 146 C90 170 150 170 158 146 L162 188 L78 188 Z"/>
    <!-- hoodie -->
    <path fill="url(#hoodie)" d="M26 240 C28 210 46 191 78 184 C92 181 106 179 120 179 C134 179 148 181 162 184 C194 191 212 210 214 240 Z"/>
    <path fill="#B488CC" d="M84 186 C92 176 148 176 156 186 C150 198 90 198 84 186 Z"/>
    <!-- neck -->
    <path fill="#F4C7B4" d="M108 148 L132 148 L133 180 C126 188 114 188 107 180 Z"/>
    <!-- drawstrings -->
    <path fill="none" stroke="#FFF4EC" stroke-width="3.4" stroke-linecap="round" d="M109 192 C108 202 107 212 106 222"/>
    <path fill="none" stroke="#FFF4EC" stroke-width="3.4" stroke-linecap="round" d="M131 192 C132 202 133 212 134 222"/>
    <ellipse fill="#FFF4EC" cx="105.8" cy="225" rx="3" ry="4"/>
    <ellipse fill="#FFF4EC" cx="134.2" cy="225" rx="3" ry="4"/>
    <!-- a tiny embroidered note -->
    <path fill="#FFF4EC" fill-opacity="0.9" d="M160 205 L168 202.5 L168 214 C168 216.2 165.8 217.6 163.8 217 C161.8 216.4 161.4 214.2 163 213 C164 212.3 165.3 212.3 166.2 212.8 L166.2 206 L161.6 207.4 L161.6 216.4 C161.6 218.6 159.4 220 157.4 219.4 C155.4 218.8 155 216.6 156.6 215.4 C157.6 214.7 158.9 214.7 159.8 215.2 Z"/>
    <!-- face -->
    <path fill="url(#face)" d="M120 48 C152 48 176 70 176 106 C176 134 160 157 137 165 C128 168.5 112 168.5 103 165 C80 157 64 134 64 106 C64 70 88 48 120 48 Z"/>
    <!-- soft shade the fringe casts on the forehead -->
    <path fill="#F3BFAE" fill-opacity="0.5" d="M74 117 C77 106 82 98 89 91 C97 83 104 76 109 67 C112 74 118 79 126 83 C138 88 148 94 155 101 C160 107 163 114 164 122 C160 113 154 106 146 101 C136 95 124 90 116 85 C112 82 110 79 109 76 C105 83 99 89 92 95 C85 101 79 108 74 117 Z"/>
