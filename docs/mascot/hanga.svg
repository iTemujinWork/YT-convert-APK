    <path fill="none" stroke="#E2CFE0" stroke-width="2.4" stroke-linecap="round" d="M61 92 C60 36 180 36 179 92"/>
    <!-- headphones: cups -->
    <ellipse fill="#F6EEF4" cx="58" cy="114" rx="11" ry="19"/>
    <ellipse fill="url(#cup)" cx="55" cy="114" rx="11" ry="19.5"/>
    <path fill="none" stroke="#F7C4E4" stroke-width="2.2" stroke-linecap="round" d="M50 104 C48 110 48 118 50 124"/>
    <ellipse fill="#F6EEF4" cx="182" cy="114" rx="11" ry="19"/>
    <ellipse fill="url(#cup)" cx="185" cy="114" rx="11" ry="19.5"/>
    <path fill="none" stroke="#F7C4E4" stroke-width="2.2" stroke-linecap="round" d="M190 104 C192 110 192 118 190 124"/>
    <!-- heather (hanga) sprig clip -->
    <path fill="none" stroke="#6E9A6F" stroke-width="2" stroke-linecap="round" d="M138 70 C146 60 156 52 170 46"/>
    <path fill="#86B98F" d="M141 68 C142 60 147 56 153 55 C151 61 147 65 141 68 Z"/>
    <path fill="#74A97F" d="M147 62 C152 64 156 68 157 74 C151 72 148 68 147 62 Z"/>
    <ellipse fill="#E58FC1" cx="143" cy="61.5" rx="3.6" ry="4.6"/>
    <ellipse fill="#D86AA9" cx="150" cy="55.5" rx="3.4" ry="4.4"/>
    <ellipse fill="#EC9ACB" cx="157" cy="50.5" rx="3.2" ry="4.2"/>
    <ellipse fill="#D86AA9" cx="163.5" cy="47" rx="2.9" ry="3.8"/>
    <ellipse fill="#F2B3D6" cx="169" cy="44.5" rx="2.4" ry="3.2"/>
    <circle fill="#FFFFFF" fill-opacity="0.75" cx="142" cy="59.6" r="1.2"/>
    <circle fill="#FFFFFF" fill-opacity="0.75" cx="149" cy="53.6" r="1.1"/>
    <circle fill="#FFFFFF" fill-opacity="0.75" cx="156" cy="48.8" r="1"/>
