<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!--
    Dalma (candidate B: soft and charming). Every top-level <g id> is a layer the app
    switches on and off per mood. Absolute coordinates, flat colours, no transforms.
    l = viewer's left, r = viewer's right.
  -->

  <!-- hair behind the head: the whole bob silhouette; only the part behind the neck shows -->
  <g id="hair_back">
    <path fill="#5A3D35" stroke="#3D2A25" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
      d="M120 22 C162 22 192 54 192 104 C192 122 191 141 190 159 C189 169 181 174 170 174 L70 174 C59 174 51 169 50 159 C49 141 48 122 48 104 C48 54 78 22 120 22 Z"/>
  </g>

  <!-- neck, hoodie, hood lapels, shirt collar, drawstrings -->
  <g id="body">
    <path fill="#F7E4D5" stroke="#B5806C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
      d="M107 148 L133 148 L133 182 C127 185 113 185 107 182 Z"/>
    <path fill="#E8C8B6" d="M107 150 L133 150 L133 160 C126 164 114 164 107 160 Z"/>
    <path fill="#8FD3BE" stroke="#3D2A25" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
      d="M-10 242 C-4 212 36 188 90 175 C102 172.5 138 172.5 150 175 C204 188 244 212 250 242 Z"/>
    <path fill="none" stroke="#7CC4AC" stroke-width="2.2" stroke-linecap="round" d="M58 196 C52 208 47 224 45 240"/>
    <path fill="none" stroke="#7CC4AC" stroke-width="2.2" stroke-linecap="round" d="M182 196 C188 208 193 224 195 240"/>
    <path fill="#8FD3BE" stroke="#5FB29A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      d="M72 186 C84 180 98 176.5 110 177.5 C113 187 116.5 197 120 207 C108 205 94 199 84 191 C80 188.5 76 187.5 72 186 Z"/>
    <path fill="#8FD3BE" stroke="#5FB29A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      d="M168 186 C156 180 142 176.5 130 177.5 C127 187 123.5 197 120 207 C132 205 146 199 156 191 C160 188.5 164 187.5 168 186 Z"/>
    <path fill="#F4FBF8" stroke="#A4B8B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
      d="M104 170 C109 172.5 114.5 174.5 120 175.5 L120 189 L117 200.5 C111 192 105 181 104 170 Z"/>
    <path fill="#F4FBF8" stroke="#A4B8B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
      d="M136 170 C131 172.5 125.5 174.5 120 175.5 L120 189 L123 200.5 C129 192 135 181 136 170 Z"/>
    <path fill="none" stroke="#F4FBF8" stroke-width="2.6" stroke-linecap="round" d="M112.5 197 C111.5 205 111 213 110.5 221"/>
    <path fill="none" stroke="#F4FBF8" stroke-width="2.6" stroke-linecap="round" d="M127.5 197 C128.5 205 129 213 129.5 221"/>
    <circle fill="#F4FBF8" cx="110.5" cy="223" r="2.8"/>
    <circle fill="#F4FBF8" cx="129.5" cy="223" r="2.8"/>
  </g>

  <!-- face -->
  <g id="head">
    <path fill="#F7E4D5" stroke="#B5806C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
      d="M120 57 C147 57 166 80 166 108 C166 132 150 155 120 156 C90 155 74 132 74 108 C74 80 93 57 120 57 Z"/>
  </g>

  <g id="blush">
    <ellipse fill="#F1B6AD" fill-opacity="0.85" cx="94" cy="129" rx="8.5" ry="5.2"/>
    <ellipse fill="#F1B6AD" fill-opacity="0.85" cx="146" cy="129" rx="8.5" ry="5.2"/>
  </g>

  <g id="nose">
    <path fill="none" stroke="#D4A594" stroke-width="2" stroke-linecap="round" d="M118 125 C119 127.2 121 127.2 122 125"/>
  </g>

  <!-- mouths -->
  <g id="mouth_smile">
    <path fill="none" stroke="#6B3F3A" stroke-width="2.4" stroke-linecap="round" d="M112.5 134 C115 139.5 125 139.5 127.5 134"/>
  </g>
  <g id="mouth_happy">
    <path fill="#6B3F3A" stroke="#6B3F3A" stroke-width="1.6" stroke-linejoin="round" d="M111 134 C114 146 126 146 129 134 C123 136 117 136 111 134 Z"/>
    <path fill="#E8908A" d="M115 140.5 C117 143.8 123 143.8 125 140.5 C122 139.6 118 139.6 115 140.5 Z"/>
  </g>
  <g id="mouth_sorry">
    <path fill="none" stroke="#6B3F3A" stroke-width="2.4" stroke-linecap="round" d="M116 137.2 C118 135.6 122 135.6 124 137.2"/>
  </g>
  <g id="mouth_sleepy">
    <path fill="none" stroke="#6B3F3A" stroke-width="2.2" stroke-linecap="round" d="M116 135.5 C117.5 138 122.5 138 124 135.5"/>
  </g>

