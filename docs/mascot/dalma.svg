  <g id="eye_l_open">
    <ellipse fill="#3A2622" cx="100.5" cy="113" rx="9" ry="9.8"/>
    <ellipse fill="#6A4A41" cx="100.5" cy="116.8" rx="5.2" ry="4.4"/>
    <circle fill="#FFFFFF" cx="97.2" cy="109" r="3"/>
    <circle fill="#FFFFFF" cx="104.2" cy="117.2" r="1.4"/>
  </g>
  <g id="eye_l_closed">
    <path fill="none" stroke="#3A2622" stroke-width="2.6" stroke-linecap="round" d="M92.5 113 C95.5 118 106.5 118 109.5 113"/>
  </g>
  <g id="eye_l_happy">
    <path fill="none" stroke="#3A2622" stroke-width="2.8" stroke-linecap="round" d="M92 118 C95 108.5 107 108.5 110 118"/>
  </g>
  <g id="eye_l_sleepy">
    <ellipse fill="#3A2622" cx="100.5" cy="113" rx="9" ry="9.8"/>
    <ellipse fill="#6A4A41" cx="100.5" cy="116.8" rx="5.2" ry="4.4"/>
    <circle fill="#FFFFFF" cx="97.5" cy="117.2" r="1.8"/>
    <path fill="#F7E4D5" d="M91 113.5 A9.5 10.8 0 0 1 110 113.5 C106 111.2 95 111.2 91 113.5 Z"/>
    <path fill="none" stroke="#3A2622" stroke-width="2.4" stroke-linecap="round" d="M92 113.5 C96 111.2 105 111.2 109 113.5"/>
  </g>

  <!-- eyes: viewer's right -->
  <g id="eye_r_open">
    <ellipse fill="#3A2622" cx="139.5" cy="113" rx="9" ry="9.8"/>
    <ellipse fill="#6A4A41" cx="139.5" cy="116.8" rx="5.2" ry="4.4"/>
    <circle fill="#FFFFFF" cx="136.2" cy="109" r="3"/>
    <circle fill="#FFFFFF" cx="143.2" cy="117.2" r="1.4"/>
