  <g id="eye_r_closed">
    <path fill="none" stroke="#3A2622" stroke-width="2.6" stroke-linecap="round" d="M130.5 113 C133.5 118 144.5 118 147.5 113"/>
  </g>
  <g id="eye_r_happy">
    <path fill="none" stroke="#3A2622" stroke-width="2.8" stroke-linecap="round" d="M130 118 C133 108.5 145 108.5 148 118"/>
  </g>
  <g id="eye_r_sleepy">
    <ellipse fill="#3A2622" cx="139.5" cy="113" rx="9" ry="9.8"/>
    <ellipse fill="#6A4A41" cx="139.5" cy="116.8" rx="5.2" ry="4.4"/>
    <circle fill="#FFFFFF" cx="136.5" cy="117.2" r="1.8"/>
    <path fill="#F7E4D5" d="M130 113.5 A9.5 10.8 0 0 1 149 113.5 C145 111.2 134 111.2 130 113.5 Z"/>
    <path fill="none" stroke="#3A2622" stroke-width="2.4" stroke-linecap="round" d="M131 113.5 C135 111.2 144 111.2 148 113.5"/>
  </g>

  <!-- brows -->
  <g id="brow_l">
    <path fill="none" stroke="#6B524A" stroke-width="2.2" stroke-linecap="round" d="M91 98 C95 94 103 93.5 109 96"/>
  </g>
  <g id="brow_r">
    <path fill="none" stroke="#6B524A" stroke-width="2.2" stroke-linecap="round" d="M149 98 C145 94 137 93.5 131 96"/>
  </g>
  <g id="brow_l_sorry">
    <path fill="none" stroke="#6B524A" stroke-width="2.2" stroke-linecap="round" d="M91 98.5 C96 97.5 103 95 109 92"/>
  </g>
  <g id="brow_r_sorry">
    <path fill="none" stroke="#6B524A" stroke-width="2.2" stroke-linecap="round" d="M149 98.5 C144 97.5 137 95 131 92"/>
  </g>

  <!-- bangs and the side locks in front of the face -->
  <g id="hair_front">
    <path fill="#5A3D35" stroke="#3D2A25" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
      d="M86 94 C94 94 108 86.5 116 83.5 C117.6 83 117.8 81.4 116.5 80.6 C115.5 79.8 116 78 118.5 77.2 C138 77 154 82 154 96 C160 126 153 156 147 167 C146 172 149 174 154 174 L170 174 C181 174 189 169 190 159 C191 141 192 122 192 104 C192 54 162 22 120 22 C78 22 48 54 48 104 C48 122 49 141 50 159 C51 169 59 174 70 174 L86 174 C91 174 94 172 93 167 C87 156 80 126 86 94 Z"/>
    <path fill="none" stroke="#7A5A4E" stroke-width="3.4" stroke-linecap="round" d="M82 60 C90 46 106 38 128 37"/>
    <path fill="none" stroke="#4B332C" stroke-opacity="0.7" stroke-width="1.6" stroke-linecap="round" d="M122 74 C128 64 136 56 146 50"/>
    <path fill="none" stroke="#4B332C" stroke-width="1.6" stroke-linecap="round" d="M64 112 C62 132 62 150 65 166"/>
    <path fill="none" stroke="#4B332C" stroke-width="1.6" stroke-linecap="round" d="M176 112 C178 132 178 150 175 166"/>
  </g>

  <!-- play-button hair clip (the app paints a progress fill over clip_shape) -->
  <g id="clip">
    <path id="clip_shape" fill="#8FD3BE" stroke="#24564B" stroke-width="2.2" stroke-linejoin="round"
      d="M156.1 59.9 L173 67.7 Q178 70 173 72.3 L156.1 80.1 Q152 82 152 77.5 L152 62.5 Q152 58 156.1 59.9 Z"/>
    <path fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" d="M158.5 66 L158.5 74"/>
  </g>

  <!-- sweat drop (sorry) -->
  <g id="drop">
    <path fill="#24564B" stroke="#8FD3BE" stroke-width="1.8" stroke-linejoin="round"
      d="M183 86 C186 92.5 190.5 96.5 190.5 101.5 C190.5 106 187 109 183 109 C179 109 175.5 106 175.5 101.5 C175.5 96.5 180 92.5 183 86 Z"/>
    <circle fill="#FFFFFF" fill-opacity="0.85" cx="180.5" cy="101.5" r="1.5"/>
  </g>

  <!-- sparkles (happy) -->
  <g id="sparkles">
    <path fill="#8FD3BE" d="M34 69 Q34 78 43 78 Q34 78 34 87 Q34 78 25 78 Q34 78 34 69 Z"/>
    <path fill="#8FD3BE" d="M206 42 Q206 50 214 50 Q206 50 206 58 Q206 50 198 50 Q206 50 206 42 Z"/>
    <path fill="#8FD3BE" d="M214 83.5 Q214 88 218.5 88 Q214 88 214 92.5 Q214 88 209.5 88 Q214 88 214 83.5 Z"/>
  </g>

  <!-- zz (sleepy) -->
  <g id="zz">
    <path fill="none" stroke="#8FD3BE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M192.5 39 L203.5 39 L192.5 49 L203.5 49"/>
    <path fill="none" stroke="#8FD3BE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M208 26.5 L216 26.5 L208 33.5 L216 33.5"/>
  </g>
</svg>
